services:
  postgres:
    image: postgres:15
    container_name: pokemon-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: pokemon
    ports:
      - "8080:8080"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./resources:/resources
    networks:
      - pokemon-network

  backend:
    build:
      context: ./back
    container_name: pokemon-backend
    ports:
      - "2000:2000"
    environment:
      DB_HOST: postgres
      DB_PORT: 8080
      DB_USER: postgres
      DB_PASSWORD: admin
      DB_NAME: pokemon
    networks:
      - pokemon-network
    depends_on:
      - postgres

  frontend:
    build:
      context: ./front
    container_name: pokemon-frontend
    ports:
      - "3000:3000"
    networks:
      - pokemon-network      
    
volumes:
  postgres-data:
    driver: local

networks:
  pokemon-network:
    driver: bridge